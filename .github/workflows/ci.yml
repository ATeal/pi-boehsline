name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Tests import lib/*.ts under Node's strip-only type stripping (>= 22.18).
        node: ['22.18', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      # pi's own packages are runtime peers; link the pinned version for the tests.
      - run: scripts/typecheck.sh --link-only
      - run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: scripts/typecheck.sh

  context-budget:
    # Starting context with Boehsline must stay within 10% of the number in
    # docs/benchmarks.md. Offline: a stand-in model, nothing is sent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      # Installs the pinned pi into .typecheck/ (no mise in CI).
      - run: scripts/typecheck.sh --link-only
      - run: node scripts/bench.mjs --check docs/benchmarks.md
        env:
          PI_BIN: ${{ github.workspace }}/.typecheck/node_modules/.bin/pi

  notif-watch:
    # The Swift notification reader; its tests skip on Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: scripts/build-notif-watch.sh
      - run: node --test test/notif-watch.test.mjs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
